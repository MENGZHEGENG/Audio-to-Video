[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-to-video-toolkit"
version = "0.1.0"
description = "Portable utilities for audio-to-video record validation and evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["a2v*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
